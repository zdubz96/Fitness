name: Weekly Program Auto-Regenerate

on:
  schedule:
    # 06:00 UTC every Sunday.
    - cron: "0 6 * * 0"
  workflow_dispatch: {}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Call weekly-program-cron
        env:
          SUPABASE_PROJECT_URL: ${{ secrets.SUPABASE_PROJECT_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_PROJECT_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SUPABASE_PROJECT_URL or CRON_SECRET repo secret not set — see docs/SUPABASE_SETUP.md Part 9."
            exit 1
          fi
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "${SUPABASE_PROJECT_URL%/}/functions/v1/weekly-program-cron" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "Content-Type: application/json")
          echo "$response"
          status=$(echo "$response" | grep "HTTP_STATUS" | cut -d: -f2)
          if [ "$status" != "200" ]; then
            echo "::error::weekly-program-cron returned HTTP $status"
            exit 1
          fi
